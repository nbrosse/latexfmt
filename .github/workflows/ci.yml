name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: The bundled latexindent config must ship in the wheel
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'latexfmt/data/latexindent.yaml'
      - name: The installed console script must run
        run: |
          uv tool install ./dist/*.whl
          latexfmt --version

  integration:
    # Exercises the real latexindent + latexmk finalizers, which the hermetic
    # unit suite deliberately skips.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install TeX Live (latexmk + latexindent)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra latexmk
      - run: uv sync --locked
      - name: Format and build a sample project
        run: uv run pytest tests/test_integration.py -v
