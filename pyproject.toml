[project]
name = "latexfmt"
version = "0.1.0"
description = "Format a LaTeX project to house conventions (math standardization, indentation, prose reflow)"
readme = "README.md"
authors = [
    { name = "Nicolas Brosse", email = "nbrosse@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
latexfmt = "latexfmt:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
